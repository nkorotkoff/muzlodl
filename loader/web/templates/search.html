{% extends "layout.html" %}
{% block title %}Search — music-loader{% endblock %}
{% block content %}
<main>
  <header class="page-header"><h1 data-i18n="search.title">Search sources</h1></header>

  <div class="search-box">
    <input type="search" id="search-input" data-i18n-placeholder="search.placeholder" placeholder="Artist — Title" autofocus>
    <button onclick="doSearch()" class="btn-primary" style="margin-top:0" data-i18n="search.btn">🔍 Search</button>
  </div>
  <p class="hint"><span data-i18n="search.hint">Examples:</span> <code data-i18n="search.hint.example">Bon Jovi — Livin' On A Prayer</code> <span data-i18n="search.orJust">or just</span> <code>Never Gonna Give You Up</code></p>

  <div id="results" style="display:none">
    <div class="toolbar">
      <span id="result-count" class="count"></span>
      <button onclick="downloadSelected()" id="dl-selected" class="btn-primary" style="margin-top:0;font-size:.85rem;padding:.4rem 1rem" data-i18n="search.downloadSelected">⬇ Download selected</button>
    </div>
    <div id="results-list"></div>
  </div>

  <div id="progress" style="display:none">
    <h3 data-i18n="search.progress.title">Download progress</h3>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <p id="progress-text"></p>
  </div>
</main>

<div id="player" style="display:none">
  <div class="player-inner">
    <button class="player-btn" onclick="closePreview()" title="Close">✕</button>
    <button class="player-btn" id="preview-play-btn" onclick="togglePreviewPlay()" title="Play/Pause">⏸</button>
    <div class="player-info">
      <span id="player-artist" class="player-artist">Preview</span>
      <span id="player-title" class="player-title"></span>
    </div>
    <div class="player-progress-wrap">
      <span id="player-current" class="player-time">0:00</span>
      <div class="player-progress" onclick="seek(event)">
        <div class="player-progress-track">
          <div class="player-progress-fill" id="player-progress-fill"></div>
        </div>
      </div>
      <span id="player-duration" class="player-time">0:00</span>
    </div>
    <div class="player-volume">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
    </div>
  </div>
  <audio id="preview-audio" preload="none"></audio>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/search.js"></script>{% endblock %}
