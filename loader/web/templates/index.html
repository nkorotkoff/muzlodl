{% extends "layout.html" %}
{% block title %}music-loader{% endblock %}
{% block content %}
<main id="app">
  <header class="page-header">
    <h1 data-i18n="library.title">Library</h1>
    <span class="stats" id="stats"></span>
  </header>

  <div class="toolbar">
    <input type="search" id="search" data-i18n-placeholder="library.searchPlaceholder" placeholder="Search tracks, artists, albums…" autofocus>
    <button onclick="showUploadModal()" class="btn-action" data-i18n="library.btn.upload" data-i18n-title="library.btn.upload" title="Upload your own file">⬆ Upload</button>
    <button onclick="exportLibrary('csv')" class="btn-action" title="Export CSV">⬇ CSV</button>
    <button onclick="exportLibrary('json')" class="btn-action" title="Export JSON">⬇ JSON</button>
    <span class="count" id="count"></span>
  </div>

  <div id="batch-bar" style="display:none" class="batch-bar">
    <span id="batch-count"></span>
    <button onclick="batchDelete()" class="btn-danger" data-i18n="library.batch.delete">🗑 Delete selected</button>
    <button onclick="clearSelection()" data-i18n="library.batch.clear">✕ Clear</button>
  </div>

  <div class="table-wrap">
    <table id="track-table">
      <thead>
        <tr>
          <th></th>
          <th><input type="checkbox" id="select-all" title="Select all"></th>
          <th class="sortable" data-sort="artist" data-i18n="library.table.artist">Artist <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="title" data-i18n="library.table.title">Title <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="album" data-i18n="library.table.album">Album <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="duration" data-i18n="library.table.duration">Duration <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="size" data-i18n="library.table.size">Size <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="created"><span data-i18n="library.table.created">Added</span> <span class="sort-arrow"></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="scroll-sentinel" class="scroll-sentinel"></div>
</main>

<div id="edit-modal" class="modal" style="display:none">
  <div class="modal-content">
    <h3 data-i18n="library.modal.editTitle">Edit track</h3>
    <label><span data-i18n="library.modal.artist">Artist</span> <input type="text" id="edit-artist"></label>
    <label><span data-i18n="library.modal.title">Title</span> <input type="text" id="edit-title"></label>
    <label><span data-i18n="library.modal.album">Album</span> <input type="text" id="edit-album"></label>
    <div class="btn-row">
      <button onclick="saveEdit()" class="btn-primary" style="margin-top:0" data-i18n="library.modal.save">💾 Save</button>
      <button onclick="closeModal('edit-modal')" data-i18n="library.modal.cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="upload-modal" class="modal" style="display:none">
  <div class="modal-content">
    <h3 data-i18n="library.modal.uploadTitle">Upload track</h3>
    <input type="file" id="upload-file" accept="audio/*,.opus,.mp3,.m4a,.ogg,.webm,.flac">
    <label><span data-i18n="library.modal.artist">Artist</span> <input type="text" id="upload-artist" data-i18n-placeholder="library.modal.artistPlaceholder" placeholder="auto from filename"></label>
    <label><span data-i18n="library.modal.title">Title</span> <input type="text" id="upload-title" data-i18n-placeholder="library.modal.titlePlaceholder" placeholder="auto from filename"></label>
    <label><span data-i18n="library.modal.album">Album</span> <input type="text" id="upload-album" data-i18n-placeholder="library.modal.albumPlaceholder" placeholder="Singles"></label>
    <div class="btn-row">
      <button onclick="doUpload()" class="btn-primary" style="margin-top:0" data-i18n="library.modal.upload">⬆ Upload</button>
      <button onclick="closeModal('upload-modal')" data-i18n="library.modal.cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="player" style="display:none">
  <div class="player-inner">
    <button class="player-btn" onclick="prevTrack()" title="Previous">⏮</button>
    <button id="play-btn" class="player-btn" onclick="togglePlay()">▶</button>
    <button class="player-btn" onclick="nextTrack()" title="Next">⏭</button>
    <button id="shuffle-btn" class="player-btn" onclick="toggleShuffle()" title="Shuffle all">🔀</button>
    <div class="player-info">
      <span id="player-artist" class="player-artist"></span>
      <span id="player-title" class="player-title"></span>
      <span id="player-queue-info" class="player-queue-info"></span>
    </div>
    <div class="player-progress-wrap">
      <span id="player-current" class="player-time">0:00</span>
      <div class="player-progress" onclick="seek(event)">
        <div class="player-progress-track">
          <div class="player-progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <span id="player-duration" class="player-time">0:00</span>
    </div>
    <div class="player-volume">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
    </div>
    <button class="player-btn" onclick="closePlayer()" title="Close">✕</button>
  </div>
  <audio id="audio" preload="none"></audio>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/index.js"></script>{% endblock %}
