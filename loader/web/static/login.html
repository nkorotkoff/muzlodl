<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — music-loader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="card" style="width:320px">
  <h3>music-loader</h3>
  <label>Username <input type="text" id="login-username" placeholder="admin" autocomplete="username"></label>
  <label style="margin-top:.5rem">Password <input type="password" id="login-password" placeholder="password" autocomplete="current-password"></label>
  <button class="btn-primary" style="width:100%;margin-top:.5rem" onclick="doLogin()">Log in</button>
  <p id="login-error" style="color:#ff7b72;margin-top:.5rem;display:none"></p>
</div>

<script src="/static/js/csrf.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
