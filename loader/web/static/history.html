<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History — music-loader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topnav">
  <a href="/" class="logo">♫ music-loader</a>
  <a href="/import">Import</a>
  <a href="/">Library</a>
  <a href="/search">Search</a>
  <a href="/stats">Stats</a>
  <a href="/history" class="active">History</a>
  <a href="/settings">Settings</a>
  <div class="nav-jobs" id="nav-jobs" style="margin-left:auto">
    <button class="btn-action" onclick="toggleJobsPanel()" id="jobs-toggle" style="display:none">⏳ <span id="jobs-count">0</span></button>
    <div class="jobs-panel" id="jobs-panel" style="display:none"></div>
  </div>
</nav>


<main>
  <header class="page-header"><h1>Import history</h1></header>

  <table id="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Source</th>
        <th>Total</th>
        <th>Downloaded</th>
        <th>Failed</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="detail-modal" class="modal" style="display:none">
    <div class="modal-content" style="width:640px;max-height:80vh;overflow-y:auto">
      <h3 id="detail-title"></h3>
      <table>
        <thead><tr><th>Artist</th><th>Title</th><th>Status</th></tr></thead>
        <tbody id="detail-body"></tbody>
      </table>
      <div class="btn-row">
        <button onclick="closeDetail()">Close</button>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="/static/js/csrf.js"></script>
<script src="/static/js/history.js"></script>
</body>
</html>
